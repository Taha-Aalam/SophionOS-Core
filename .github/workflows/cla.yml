name: CLA Assistant

# Enforces the SophionOS Contributor License Agreement (CLA.md). Pull requests
# from contributors who have not signed the CLA are blocked until they sign
# by commenting "I have read the CLA Document and I hereby sign the CLA".
#
# Setup (one-time):
# 1. Create a GitHub Personal Access Token (classic, `repo` scope) with access
#    to this repository and add it as a repository secret named
#    `CLA_PERSONAL_ACCESS_TOKEN`. The action uses it to write signatures to
#    the `cla-signatures` branch. A `GITHUB_TOKEN` alone is not sufficient.
# 2. Optional: replace the static signature branch (`branch: cla-signatures`)
#    with a private repository by setting `remote-organization-name` and
#    `remote-repository-name` below.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/Taha-Aalam/SophionOS-Core/blob/master/CLA.md
          branch: cla-signatures
          # Bots (Dependabot etc.) cannot sign a CLA; skip the check for them.
          allowlist: dependabot[bot],github-actions[bot],renovate[bot]
