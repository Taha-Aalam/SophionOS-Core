# Builds and publishes the public SophionOS Core image to GHCR.
#
# The package is PUBLIC (this repo is public): self-hosters pull it without
# authenticating. Pushing requires `packages: write` with the workflow token.
#
# NEXT_PUBLIC_* comes from GitHub Actions *variables* (not secrets) — those
# values are inlined into the client bundle at build time and ship to every
# browser by design. Server-only credentials are runtime env on the operator's
# box and never appear here. Unset variables fall back to the Dockerfile ARG
# defaults, so an image built before the variables exist is CI-verified but
# wired to the placeholder Supabase project — not production-usable.
#
# Images publish only for work that landed on master: the branch trigger is
# master itself, and the version-tag trigger exists for the tags the release
# workflow cuts at a merge commit (see release.yml). The "Version tags must
# sit on master" step enforces that second half — a v* tag pushed from a
# branch fails loudly instead of publishing an image.
name: Docker build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # GHCR image names must be lowercase.
  IMAGE: ghcr.io/taha-aalam/sophionos-core

jobs:
  build-and-push:
    name: Build amd64 + arm64 image → GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Version tags must sit on master
        # ^{commit} dereferences annotated tags, so the check works whether
        # GITHUB_SHA carries the commit or the tag object. The compare API's
        # status is head-relative: "behind"/"identical" mean the tag commit
        # is an ancestor of master; "ahead"/"diverged" mean it is not.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/master...${tag_commit}" --jq .status)"
          if [[ "${status}" != "behind" && "${status}" != "identical" ]]; then
            echo "::error::${GITHUB_REF_NAME} points at ${tag_commit}, which is not on master. Docker images build only after a merge to master (release.yml cuts version tags there). Skipping."
            exit 1
          fi

      - name: Compute image tags
        id: tags
        # latest + sha-<short> on every master push; a version tag (v0.2.1)
        # also publishes the bare version (0.2.1). Tags are passed as a list
        # of newline-separated values to build-push-action.
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tags="${IMAGE}:latest"$'\n'"${IMAGE}:sha-${short_sha}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags="${tags}"$'\n'"${IMAGE}:${version}"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'build-anon-placeholder' }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_build_placeholder' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
