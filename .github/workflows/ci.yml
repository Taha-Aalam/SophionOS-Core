name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, audit, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests (incl. dual-user isolation)
        run: pnpm test
        env:
          NODE_ENV: test
          RATE_LIMIT_STORE: memory

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-placeholder
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          NEXT_PUBLIC_APP_URL: http://app.localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder

      - name: Dependency audit (high+)
        # Fails the job on high/critical production advisories.
        run: pnpm audit --audit-level=high

      - name: Structural migration gate
        run: node scripts/check-migrations-structure.mjs

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secret scan (git history)
        run: gitleaks git . --no-banner --redact -c .gitleaks.toml
        continue-on-error: true
        # History may contain pre-remediation secrets; current-tree scan is blocking.

      - name: Secret scan (current tree sources)
        run: |
          set -euo pipefail
          for p in src supabase packages docs scripts .github; do
            echo "Scanning $p"
            gitleaks dir "$p" --no-banner --redact -c .gitleaks.toml
          done
          gitleaks dir .env.example --no-banner --redact -c .gitleaks.toml

  security-harness:
    name: API-key differential permission harness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Fails the build on any 2xx from a bypass variant (encoded/slug id,
      # unmapped route) or on any permanent delete reachable via API key.
      - name: Differential permission harness (encoded/slug × entities × key modes)
        run: ./node_modules/.bin/vitest run tests/security/api-key-differential.test.ts
        env:
          NODE_ENV: test

      # Fails the build if any /api/v1 data route lacks a permission-map
      # entry (the fail-closed layer would deny it at runtime).
      - name: Route permission map coverage
        run: node scripts/check-route-permissions.mjs

  migrations:
    name: Migrations structure + clean Postgres attempt
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: sophionos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Structural gate (always)
        run: node scripts/check-migrations-structure.mjs

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply SQL migrations (best-effort on plain Postgres)
        env:
          PGPASSWORD: postgres
        run: |
          set -uo pipefail
          # Full Supabase runtime (auth schema, roles) is not present on plain
          # Postgres. We still attempt ordered apply for early syntax/schema
          # feedback; structural gate above is the hard launch check.
          ok=0
          fail=0
          for f in $(ls -1 supabase/migrations/*.sql | sort); do
            echo "==> $f"
            if psql -h localhost -U postgres -d sophionos -v ON_ERROR_STOP=1 -f "$f"; then
              ok=$((ok+1))
            else
              fail=$((fail+1))
              echo "WARN: migration required Supabase-specific objects: $f"
            fi
          done
          echo "Applied_ok=$ok applied_fail=$fail"
          test "$ok" -gt 0
