# Gitleaks config for SophionOS CI and local scans.
# Extends defaults; path allowlists reduce noise from local agent caches.

title = "SophionOS gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Local tooling and build artifacts"
paths = [
  '''node_modules''',
  '''\.next''',
  '''\.claude''',
  '''\.codegraph''',
  '''graphify-out''',
  '''bin/''',
  '''pnpm-lock\.yaml''',
  '''\.worktrees''',
]

# Google OAuth client secrets (audit r1 finding 8): the class is caught by
# name, not just by the default generic rules.
[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret"
regex = '''GOCSPX-[A-Za-z0-9_-]{28,}'''
keywords = ["GOCSPX-"]
