# Gitleaks config for SophionOS CI and local scans.
# Extends defaults; path allowlists reduce noise from local agent caches.

title = "SophionOS gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Local tooling and build artifacts"
paths = [
  '''node_modules''',
  '''\.next''',
  '''\.claude''',
  '''\.codegraph''',
  '''graphify-out''',
  '''bin/''',
  '''pnpm-lock\.yaml''',
  '''\.worktrees''',
]

# Google OAuth client secrets (audit r1 finding 8): the class is caught by
# name, not just by the default generic rules.
[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret"
regex = '''GOCSPX-[A-Za-z0-9_-]{28,}'''
keywords = ["GOCSPX-"]

# Audit F10 follow-up: the whole-tree scan (widened from the old directory
# enumeration) covers tests/ for the first time. The shipped cron-briefs
# hardening test uses an obviously fake CRON_SECRET constant to exercise the
# route's timing-safe compare; the default generic-api-key rule flags the
# assignment shape. Scoped exemption: this rule + this file only — every
# other path and rule keeps scanning at full strength.
[[allowlists]]
ruleId = "generic-api-key"
paths = [
  '''tests/unit/cron-briefs-hardening\.test\.ts''',
]
