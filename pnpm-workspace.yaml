allowBuilds:
  core-js: false
  esbuild: true
  msw: true
  sharp: false
  supabase: true
  unrs-resolver: false
  workerd: true

packages:
  - "packages/*"

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

overrides:
  # GHSA-v2hh-gcrm-f6hx / GHSA-4c8g-83qw-93j6
  fast-uri: ">=4.1.3"
  hono: ">=4.12.34"
  ip-address: ">=10.3.1"
  # GHSA-6g55-p6wh-862q
  postcss: ">=8.5.23"
  # GHSA-68fv-2mgg-jv7q (source-map-js event-loop DoS via indexed source-map
  # section offsets). Transitive through postcss -> next / @clerk/nextjs / shadcn.
  source-map-js: ">=1.2.2"
  # GHSA-6qxp-vccf-f47h (MCP SDK OAuth client could send credentials to a
  # redirected host). Reached only through shadcn@4.21.0, which declares
  # ^1.26.0 - 1.31.0 is inside that range, so this is a nudge, not a force.
  # Our own @sophionos/mcp-server already resolves 1.31.0.
  "@modelcontextprotocol/sdk": ">=1.31.0"
  # GHSA-3jxr-9vmj-r5cp / GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p —
  # pin major lines separately (blanket 5.x breaks minimatch@3/eslint)
  brace-expansion@1: "1.1.20"
  brace-expansion@5: ">=5.0.11"
  "minimatch@3>brace-expansion": "1.1.20"
  # GHSA-52cp-r559-cp3m / GHSA-pm4m-ph32-ghv5
  js-yaml: ">=5.2.2"
  ws: ">=8.21.0"
  # GHSA-q8mj-m7cp-5q26
  qs: ">=6.15.2"
  # GHSA-v422-hmwv-36x6
  body-parser: ">=2.3.0"
  # GHSA-frvp-7c67-39w9
  "@hono/node-server": ">=2.0.5"
  # jsdom@29 requires undici 7 private paths (wrap-handler.js); undici 8 removed them.
  # Pin to 7.x — satisfies jsdom@29 and the undici security fix (GHSA-4cwx-7wf7-3272, patched in 7.29.0).
  undici: ">=7.29.0 <8.0.0"
  vite: ">=8.0.16"
  # next still depends on sharp <0.35.4 (libvips CVEs); force patched line (GHSA-rgj7-g3m4-5g8c).
  sharp: ">=0.35.4"
  nanoid@<3.3.18: ^3.3.18

auditConfig:
  ignoreGhsas:
    # No patched release exists yet (latest braces is 3.0.3; advisory claims
    # >=3.0.4 but it is unpublished). Only reachable via build-time tooling
    # (shadcn / ts-morph / eslint plugin), not runtime. Remove once 3.0.4 ships.
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-mh99-v99m-4gvg

minimumReleaseAgeExclude:
  - nanoid@3.3.17
  - nanoid@3.3.18
