allowBuilds:
  core-js: false
  msw: true
  sharp: false
  supabase: true
  unrs-resolver: false

packages:
  - "packages/*"

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

overrides:
  # GHSA-v2hh-gcrm-f6hx / GHSA-4c8g-83qw-93j6
  fast-uri: ">=3.1.4"
  hono: ">=4.12.25"
  ip-address: ">=10.1.1"
  # GHSA-6g55-p6wh-862q
  postcss: ">=8.5.12"
  # GHSA-3jxr-9vmj-r5cp — pin major lines separately (blanket 5.x breaks minimatch@3/eslint)
  brace-expansion@1: "1.1.16"
  brace-expansion@5: "5.0.7"
  "minimatch@3>brace-expansion": "1.1.16"
  # GHSA-52cp-r559-cp3m
  js-yaml: ">=4.3.0"
  ws: ">=8.21.0"
  # jsdom@29 requires undici 7 private paths (wrap-handler.js); undici 8 removed them.
  undici: "7.28.0"
  vite: ">=8.0.16"
  # next@16.2.11 still depends on sharp@0.34.x (libvips CVEs); force patched line.
  sharp: ">=0.35.0"
