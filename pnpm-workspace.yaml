allowBuilds:
  core-js: false
  msw: true
  sharp: false
  supabase: true
  unrs-resolver: false

packages:
  - "packages/*"

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

overrides:
  fast-uri: ">=3.1.2"
  hono: ">=4.12.25"
  ip-address: ">=10.1.1"
  postcss: ">=8.5.10"
  brace-expansion@5: ">=5.0.6"
  ws: ">=8.21.0"
  # jsdom@29 requires undici 7 private paths (wrap-handler.js); undici 8 removed them.
  undici: "7.28.0"
  vite: ">=8.0.16"
  # next@16.2.11 still depends on sharp@0.34.x (libvips CVEs); force patched line.
  sharp: ">=0.35.0"
