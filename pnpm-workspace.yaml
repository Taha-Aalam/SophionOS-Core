allowBuilds:
  core-js: false
  esbuild: true
  msw: true
  sharp: false
  supabase: true
  unrs-resolver: false
  workerd: true

packages:
  - "packages/*"

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

overrides:
  # GHSA-v2hh-gcrm-f6hx / GHSA-4c8g-83qw-93j6 / GHSA-hrr3-gc8f-f4qj /
  # GHSA-jvvf-x445-j334 / GHSA-w74x-v6f9-j3xg / GHSA-wjr9-j795-jxcr /
  # GHSA-xhq7-xmqj-769h / GHSA-333x-w4r6-6crp — everything patched by 4.2.3.
  fast-uri: ">=4.2.3"
  hono: ">=4.12.34"
  # GHSA-rxp7-6hxx-x8q5 (quadratic zone-id scan patched in 10.7.4); reached at
  # runtime via @modelcontextprotocol/sdk > express-rate-limit.
  ip-address: ">=10.7.4"
  # GHSA-6g55-p6wh-862q
  postcss: ">=8.5.23"
  # GHSA-68fv-2mgg-jv7q (source-map-js event-loop DoS via indexed source-map
  # section offsets). Transitive through postcss -> next / @clerk/nextjs / shadcn.
  source-map-js: ">=1.2.2"
  # GHSA-6qxp-vccf-f47h (MCP SDK OAuth client could send credentials to a
  # redirected host). Reached only through shadcn@4.21.0, which declares
  # ^1.26.0 - 1.31.0 is inside that range, so this is a nudge, not a force.
  # Our own @sophionos/mcp-server already resolves 1.31.0.
  "@modelcontextprotocol/sdk": ">=1.31.0"
  # GHSA-3jxr-9vmj-r5cp / GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p /
  # GHSA-q2hr-2g5m-vwhr — pin major lines separately (blanket 5.x breaks
  # minimatch@3/eslint); 1.1.21 fixes the quadratic {a},b} expansion.
  brace-expansion@1: "1.1.21"
  brace-expansion@5: ">=5.0.11"
  "minimatch@3>brace-expansion": "1.1.21"
  # GHSA-52cp-r559-cp3m / GHSA-pm4m-ph32-ghv5 / GHSA-r3ph-w7gj-g6xm
  # (maxTotalMergeKeys CPU exhaustion patched in 5.4.1)
  js-yaml: ">=5.4.1"
  # GHSA-p498-v437-472g (recursive copy follows symlinked files outside the
  # source tree). Dev-only: reached through eslint's file traversal.
  "@humanfs/node": ">=0.16.8"
  ws: ">=8.21.0"
  # GHSA-q8mj-m7cp-5q26
  qs: ">=6.15.2"
  # GHSA-v422-hmwv-36x6 / GHSA-27r3-jxmh-p828 (2.4.0 fixes the trailing-bytes
  # DoS on compressed request bodies)
  body-parser: ">=2.4.0"
  # GHSA-frvp-7c67-39w9
  "@hono/node-server": ">=2.0.5"
  # jsdom@29 requires undici 7 private paths (wrap-handler.js); undici 8 removed them.
  # Pin to 7.x — satisfies jsdom@29 and the undici security fixes (GHSA-4cwx-7wf7-3272
  # patched in 7.29.0; GHSA-xjj6-f33q-929c patched in 7.30.1).
  undici: ">=7.30.1 <8.0.0"
  # GHSA-mrhx-c7xc-m3w5 (memory exhaustion validating oversized constrained
  # collections, patched in 4.6.6). Both consumers already resolve zod 4.x
  # (MCP SDK accepts ^3.25 || ^4), so this is a nudge, not a force.
  zod: ">=4.6.6"
  # GHSA-587h-7wmj-h5pm / GHSA-698v-4r3x-3vcv / GHSA-9jrq-w75r-8gcw /
  # GHSA-r825-w8mm-5pxw / GHSA-rq7h-c2jc-7f22 — all patched in 8.1.6.
  vite: ">=8.1.6"
  # next still depends on sharp <0.35.4 (libvips CVEs); force patched line (GHSA-rgj7-g3m4-5g8c).
  sharp: ">=0.35.4"
  nanoid@<3.3.18: ^3.3.18

auditConfig:
  ignoreGhsas:
    # No patched release exists yet (latest braces is 3.0.3; advisory claims
    # >=3.0.4 but it is unpublished). Only reachable via build-time tooling
    # (shadcn / ts-morph / eslint plugin), not runtime. Remove once 3.0.4 ships.
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-mh99-v99m-4gvg

minimumReleaseAgeExclude:
  - nanoid@3.3.17
  - nanoid@3.3.18
