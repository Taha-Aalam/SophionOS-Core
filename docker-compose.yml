# SophionOS evaluation stack — app only.
# Clerk + Supabase remain external (local CLI or hosted). See docs/self-hosting.md.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Browser-visible configuration. NEXT_PUBLIC_* is inlined into the client
      # bundle by `next build`, so it must be set BEFORE the image is built —
      # runtime `environment:` cannot change it. Values come from your shell or
      # .env; `docker compose build` after changing any of them.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://example.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-build-anon-placeholder}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_build_placeholder}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      # Server-only secrets: runtime env, never baked into the image.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_ci_placeholder}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-ci-service-role-placeholder}
      RATE_LIMIT_STORE: memory
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok||r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
